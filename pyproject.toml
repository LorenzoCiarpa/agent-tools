# Workspace root (virtual: it is not a package itself).
# Each member under packages/ is an independently installable distribution.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]
extend-exclude = ["packages/*/src/*/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PTH", "BLE"]
"**/cli/**" = ["B008"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not slow and not gpu and not network and not audio_device' --import-mode=importlib"
testpaths = ["packages"]
markers = [
    "slow: downloads models or processes real audio (run with -m slow)",
    "gpu: needs a CUDA GPU",
    "network: needs internet access",
    "audio_device: needs a working microphone",
]
